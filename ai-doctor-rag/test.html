<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG AI 医生 - 测试页</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px;
      background: #f5f5f5;
    }
    h1 {
      color: #2d9a8f;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .config {
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .config label { margin-right: 12px; }
    .config input[type="text"] {
      width: 280px;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
    .chat-box {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      min-height: 320px;
      margin-bottom: 16px;
    }
    .messages {
      min-height: 200px;
      max-height: 400px;
      overflow-y: auto;
    }
    .msg {
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      max-width: 90%;
    }
    .msg.user {
      background: #e8f5f3;
      margin-left: 0;
      margin-right: auto;
    }
    .msg.assistant {
      background: #f0f0f0;
      margin-left: auto;
      margin-right: 0;
    }
    .msg .meta {
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }
    .msg .content { white-space: pre-wrap; word-break: break-word; }
    .msg .content h1,.msg .content h2,.msg .content h3 { margin: 0.6em 0 0.3em; }
    .msg .content ul,.msg .content ol { margin: 0.4em 0; padding-left: 1.5em; }
    .msg .content p { margin: 0.4em 0; }
    .refs {
      margin-top: 12px;
      font-size: 12px;
      color: #666;
      border-top: 1px solid #eee;
      padding-top: 8px;
    }
    .refs summary { cursor: pointer; }
    .refs ul { margin: 8px 0 0; padding-left: 20px; }
    .input-row {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    .input-row input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }
    .input-row button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #3EAFA5, #2D9A8F);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    .input-row button:hover { opacity: 0.9; }
    .input-row button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status {
      font-size: 13px;
      color: #888;
      margin-top: 8px;
    }
    .status.err { color: #c00; }
    .status.ok { color: #2d9a8f; }
  </style>
</head>
<body>
  <h1>RAG AI 医生</h1>
  <p class="subtitle">基于 Hugging Face HuatuoGPT + ChatDoctor 数据集 · 仅供测试与参考，不构成医疗建议</p>

  <div class="config">
    <label>API 地址:</label>
    <input type="text" id="apiBase" value="http://127.0.0.1:8765" />
    <span style="margin-left:8px;color:#888">（确保已运行 python app.py 或 uvicorn app:app --port 8765）</span>
    <button type="button" id="clearBtn" style="margin-left:12px;padding:6px 12px;border:1px solid #999;border-radius:6px;background:#fff;cursor:pointer">清空对话</button>
  </div>

  <div class="chat-box">
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <input type="text" id="userInput" placeholder="输入健康/症状问题，例如：最近一周头痛头晕可能是什么原因？" />
      <button id="sendBtn">发送</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const apiBaseEl = document.getElementById("apiBase");
    const messagesEl = document.getElementById("messages");
    const userInputEl = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusEl = document.getElementById("status");

    // 上下文对话记录，用于多轮问答
    let conversationHistory = [];

    function setStatus(text, isErr) {
      statusEl.textContent = text;
      statusEl.className = "status " + (isErr ? "err" : "ok");
    }

    function addToHistory(role, content) {
      conversationHistory.push({ role: role, content: content });
      // 限制历史长度，避免请求过大（最近 10 轮）
      const maxTurns = 10;
      if (conversationHistory.length > maxTurns * 2) {
        conversationHistory = conversationHistory.slice(-maxTurns * 2);
      }
    }

    function appendMessage(role, content, refs, usedLlm, bestSimilarity) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      const meta = document.createElement("div");
      meta.className = "meta";
      let metaText = role === "user" ? "您" : "AI 医生" + (usedLlm ? " (含 LLM 生成)" : " (检索参考)");
      if (role === "assistant" && bestSimilarity != null) {
        metaText += " · 匹配度 " + (bestSimilarity).toFixed(3);
        if (bestSimilarity < 0.45) metaText += "（较低，结果可能不相关）";
      }
      meta.textContent = metaText;
      const body = document.createElement("div");
      body.className = "content";
      try {
        body.innerHTML = (typeof marked !== "undefined" && marked.parse)
          ? marked.parse(content || "")
          : (content || "").replace(/</g, "&lt;").replace(/\n/g, "<br>");
      } catch (e) {
        body.textContent = content;
      }
      div.appendChild(meta);
      div.appendChild(body);
      if (role === "assistant" && refs && refs.length) {
        const refDiv = document.createElement("div");
        refDiv.className = "refs";
        refDiv.innerHTML = "<summary>查看检索参考 (" + refs.length + " 条)</summary>";
        const ul = document.createElement("ul");
        refs.forEach((r, i) => {
          const li = document.createElement("li");
          li.textContent = "相似度 " + (r.similarity ? r.similarity.toFixed(3) : "-") + ": " + (r.question || "").slice(0, 80) + "...";
          ul.appendChild(li);
        });
        refDiv.appendChild(ul);
        div.appendChild(refDiv);
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function send() {
      const query = userInputEl.value.trim();
      if (!query) return;
      const base = apiBaseEl.value.replace(/\/$/, "");
      sendBtn.disabled = true;
      setStatus("正在请求...", false);
      appendMessage("user", query);
      addToHistory("user", query);

      try {
        const res = await fetch(base + "/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: query, top_k: 5, history: conversationHistory.slice(0, -1) }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          setStatus("错误: " + (err.detail || res.statusText), true);
          appendMessage("assistant", "请求失败: " + (err.detail || res.statusText), [], false, null);
          return;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let meta = null;
        let content = "";
        let msgEl = null;
        let bodyEl = null;
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop() || "";
          for (const line of lines) {
            if (!line.trim()) continue;
            try {
              const obj = JSON.parse(line);
              if (obj.type === "meta") {
                meta = obj;
                content = "";
                msgEl = document.createElement("div");
                msgEl.className = "msg assistant";
                const metaDiv = document.createElement("div");
                metaDiv.className = "meta";
                let metaText = "AI 医生" + (obj.used_llm ? " (含 LLM 生成)" : " (检索参考)");
                if (obj.best_similarity != null) {
                  metaText += " · 匹配度 " + (obj.best_similarity).toFixed(3);
                }
                metaDiv.textContent = metaText;
                bodyEl = document.createElement("div");
                bodyEl.className = "content";
                msgEl.appendChild(metaDiv);
                msgEl.appendChild(bodyEl);
                messagesEl.appendChild(msgEl);
              } else if (obj.type === "chunk" && obj.content && bodyEl) {
                content += obj.content;
                try {
                  bodyEl.innerHTML = (typeof marked !== "undefined" && marked.parse)
                    ? marked.parse(content)
                    : content.replace(/</g, "&lt;").replace(/\n/g, "<br>");
                } catch (e) {
                  bodyEl.textContent = content;
                }
                messagesEl.scrollTop = messagesEl.scrollHeight;
              } else if (obj.type === "done") {
                if (content) addToHistory("assistant", content);
                if (meta && meta.references && meta.references.length && msgEl) {
                  const refDiv = document.createElement("div");
                  refDiv.className = "refs";
                  refDiv.innerHTML = "<summary>查看检索参考 (" + meta.references.length + " 条)</summary>";
                  const ul = document.createElement("ul");
                  meta.references.forEach((r) => {
                    const li = document.createElement("li");
                    li.textContent = "相似度 " + (r.similarity ? r.similarity.toFixed(3) : "-") + ": " + (r.question || "").slice(0, 80) + "...";
                    ul.appendChild(li);
                  });
                  refDiv.appendChild(ul);
                  msgEl.appendChild(refDiv);
                }
              }
            } catch (e) {}
          }
        }
        setStatus("回复完成", false);
      } catch (e) {
        setStatus("请求失败: " + e.message, true);
        appendMessage("assistant", "网络或服务异常，请确认后端已启动且地址正确。", [], false, null);
      } finally {
        sendBtn.disabled = false;
        userInputEl.value = "";
      }
    }

    document.getElementById("clearBtn").addEventListener("click", () => {
      conversationHistory = [];
      messagesEl.innerHTML = "";
      setStatus("已清空对话", false);
    });
    sendBtn.addEventListener("click", send);
    userInputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  </script>
</body>
</html>
